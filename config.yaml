seed: 42
samples_per_prompt: 3
temperature: 0.7
top_p: 1.0
max_tokens: 800
providers:
  openai:
    enabled: true
    model: "gpt-4o-mini"
  anthropic:
    enabled: false
    model: "claude-3-5-sonnet-latest"
  gemini:
    enabled: false
    model: "gemini-1.5-pro"
io:
  prompts_out: "prompts/generated"
  results_out: "results/raw"
  analysis_out: "analysis"
data:
  players_csv: "data/players_2024.csv"
  demographics_csv: "data/demographics_anon.csv"   # optional
privacy:
  enforce_anonymized_ids: true
